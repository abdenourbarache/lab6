apiVersion: v1
kind: Secret
metadata:
  name: {{ include "lab7.fullname" . }}-dockerhub
  labels:
    {{- include "lab7.labels" . | nindent 4 }}
type: kubernetes.io/dockerconfigjson
data:
  .dockerconfigjson: {{ printf "{\"auths\":{\"https://index.docker.io/v1/\":{\"username\":\"%s\",\"password\":\"%s\",\"auth\":\"%s\"}}}"
    .Values.imageCredentials.username
    .Values.imageCredentials.password
    (printf "%s:%s" .Values.imageCredentials.username .Values.imageCredentials.password | b64enc)
    | b64enc }}